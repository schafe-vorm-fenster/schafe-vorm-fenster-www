name: Check

# M4 — minimal CI (DEC-031 stage 2, prototype subset; TS-015).
#
# This is not the full D4 job graph of specs/tactical/delivery-pipeline.tactical.md
# (no Quality/knip/jscpd/security job, no Preview-Deployment job, no Budgets
# job, no branch-protection wiring) — the work package that shipped this file
# (M4) explicitly scopes it to: install · `pnpm check` · `pnpm build` ·
# `pnpm e2e` against the local production build. It does not gate merges yet
# (TS-015-A3/A4/A5/A10/A12 stay "not yet" — see README.md's CI section for
# the per-AC status). The full graph, auto-merge and rolling production
# promotion are stage-2 follow-up work, not part of this run.
#
# The `@schafe-vorm-fenster` scope on npm.pkg.github.com is private and
# spread across several sibling repos in the org (brand-design and friends
# are published from `go-to-market-os`, not from this repo). The built-in
# `secrets.GITHUB_TOKEN` can only read packages by default when the
# publishing repo has granted this repo's workflows "Manage Actions access"
# to the package — an org/package dashboard setting, not something `gh`/the
# Actions API can flip from here. If installs start failing with 401/403
# from npm.pkg.github.com, that grant is what is missing; see the open row
# this work package filed in `state/open.md`.

on:
  push:
    branches: [next-2026]
  pull_request:
    branches: [next-2026]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm check (the single gate — frontmatter · content · specs · stack · brand · typecheck · lint · tests)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium (with OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E — Playwright against the local production build
        run: pnpm e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
